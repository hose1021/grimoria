[workspace]
resolver = "3"
members = [
  "crates/grimoria-domain",
  "crates/grimoria-wire",
  "crates/grimoria-conformance",
  "crates/grimoria-wasm",
  "crates/grimoria-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
