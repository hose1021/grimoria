<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your role · Pocket Grimoire</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../web/fonts/inter/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #0a0c0e;
    --panel: #13181b;
    --panel-2: #171e22;
    --line: #273137;
    --line-2: #35424a;
    --text: #eeeae1;
    --muted: #909ca3;
    --accent: #d8b06a;
    --townsfolk: #58a6dc;
    --outsider: #6fbf8b;
    --minion: #e08545;
    --demon: #d95555;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(70% 50% at 50% 0%, #141b1f 0%, var(--bg) 65%);
    color: var(--text);
    font: 15px/1.5 "Inter", system-ui, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 18px;
  }
  button, a, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  .wrap {
    width: min(430px, 100%);
    min-height: min(820px, calc(100dvh - 36px));
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  .wrap[data-page="numbers"] { justify-content: flex-start; padding-top: 8px; }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .tag {
    font-size: 9.5px;
    font-weight: 650;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
  }
  .link { margin-left: auto; font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
  .kicker {
    margin: 0 0 6px;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 { margin: 0; font-size: clamp(26px, 7vw, 34px); line-height: 1.1; letter-spacing: -.03em; font-weight: 650; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; }
  /* number picker */
  .numbers {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  .num {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    font-size: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .num:hover { border-color: var(--line-2); background: var(--panel-2); }
  .num small {
    position: absolute;
    left: 4px; right: 4px; bottom: 6px;
    font-size: 8.5px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .num[disabled] { cursor: not-allowed; opacity: .4; border-style: dashed; background: transparent; }
  .num[disabled]:hover { border-color: var(--line); background: transparent; }
  .hintline { margin: 2px 0 0; font-size: 11px; color: #68757c; text-align: center; }
  .demo-reset {
    display: block; margin: 6px auto 0;
    border: 0; background: none; color: #5d696f;
    font-size: 10.5px; text-decoration: underline; text-underline-offset: 2px;
    cursor: pointer;
  }
  .empty {
    margin-top: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  /* role card */
  .timer { height: 3px; border-radius: 3px; background: #202a30; overflow: hidden; }
  .timer span {
    display: block; height: 100%; width: 100%;
    background: var(--accent);
    transform-origin: left center;
  }
  .timer__text {
    margin: 6px 0 0;
    font-size: 10.5px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .role {
    border: 1px solid #4a3d26;
    border-radius: 18px;
    background:
      radial-gradient(80% 50% at 50% 0%, rgba(216, 176, 106, .09), transparent 65%),
      linear-gradient(180deg, var(--panel-2), var(--panel));
    padding: 16px 20px 18px;
    text-align: center;
    animation: reveal .22s ease-out both;
  }
  @keyframes reveal {
    from { opacity: 0; transform: scale(.965); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .role { animation: none; } }
  .role__seat {
    margin: 0;
    font-size: 9.5px; font-weight: 650;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  .role__art { display: grid; place-items: center; margin-top: 2px; }
  .role__art img { width: 176px; height: 176px; object-fit: contain; }
  .role__name {
    margin: 2px 0 0;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(32px, 10vw, 42px);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.05;
    color: #f4e9d2;
  }
  .role__team {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 6px;
    font-size: 11px;
    color: #c3ccc8;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot--Townsfolk { background: var(--townsfolk); }
  .dot--Outsider { background: var(--outsider); }
  .dot--Minion { background: var(--minion); }
  .dot--Demon { background: var(--demon); }
  .role__ability { margin: 12px 0 0; font-size: 14px; line-height: 1.55; color: #d8dcd6; }
  .role__note { margin: 12px 0 0; font-size: 10.5px; color: #75827a; }
  .nameform { display: grid; gap: 7px; margin-top: 12px; text-align: left; }
  .nameform label { font-size: 10px; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
  .nameform input {
    width: 100%;
    border: 1px solid var(--line-2);
    border-radius: 9px;
    background: #0b1013;
    padding: 11px 12px;
    font-size: 14px;
  }
  .nameform input::placeholder { color: #66737a; }
  .primary {
    width: 100%;
    border: 1px solid #6d5730;
    background: #332815;
    color: #f5dcae;
    border-radius: 11px;
    padding: 13px 16px;
    font-size: 14px;
    font-weight: 550;
    cursor: pointer;
  }
  .primary:hover { background: #3d3019; }
  .quiet {
    border: 0; background: none; color: var(--muted);
    font-size: 12.5px; cursor: pointer; padding: 8px;
    text-align: center; text-decoration: none;
  }
  .quiet:hover { color: var(--text); }
  /* done */
  .done { text-align: center; display: grid; justify-items: center; gap: 10px; padding: 26px 0; }
  .done__mark {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid var(--line-2);
    display: grid; place-items: center;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .done h1 { font-size: 28px; }
  .done p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 30ch; }
  .done .primary { margin-top: 16px; }
  @media (max-width: 560px) {
    body { padding: 14px; }
    .wrap { min-height: calc(100dvh - 28px); gap: 14px; }
  }
  @media (max-height: 720px) {
    .role__art img { width: 140px; height: 140px; }
    .role__name { font-size: 30px; }
    .role__ability { margin-top: 9px; font-size: 13px; }
    .role__note { margin-top: 9px; }
  }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script src="../../web/build/data/en_GB.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(function () {
  var state = JSON.parse(JSON.stringify(window.GAME));
  state = PGStore.hydrate(state);
  var app = document.getElementById("app");
  var page = "numbers";
  var seat = 0;
  var session = {};        // player id -> name typed during this pass
  var timer = null;
  var remaining = 45;
  var total = 45;

  var params = new URLSearchParams(window.location.search);
  if (params.get("seat")) {
    seat = Number(params.get("seat"));
    var linked = state.seats.find(function (p) { return p.seat === seat; });
    if (linked && !linked.claimed) session[linked.id] = "";
    else page = "numbers";
  }

  function player() { return state.seats.find(function (p) { return p.seat === seat; }); }
  function taken(p) {
    return !!p.claimed || session[p.id] !== undefined;
  }
  function nameFor(p) {
    if (session[p.id] !== undefined) return session[p.id];
    return p.claimed ? p.name : "";
  }
  function shown(p) {
    return {
      role: p.shownRole || p.role,
      team: p.shownTeam || p.team,
      img: p.shownImg || p.img,
      ability: p.shownAbility || p.ability
    };
  }

  function bar() {
    return '<header class="bar"><span class="tag">Storyteller device</span>' +
      '<a class="link" href="workbench.html">Back to grimoire</a></header>';
  }

  function renderNumbers() {
    var free = state.seats.filter(function (p) { return !taken(p); });
    app.innerHTML =
      bar() +
      '<section>' +
      '<p class="kicker">Pass the device</p>' +
      '<h1>Pick your seat</h1>' +
      '<p class="sub">Tap a number. Only then does your role appear.</p>' +
      '</section>' +
      (free.length
        ? '<div class="numbers">' + state.seats.map(function (p) {
            var isTaken = taken(p);
            return '<button class="num" type="button" data-seat="' + p.seat + '"' +
              (isTaken ? ' disabled aria-label="Seat ' + p.seat + ', taken"' : '') + '>' +
              p.seat + (isTaken ? '<small>' + (nameFor(p) || "Taken") + '</small>' : '') + '</button>';
          }).join("") + '</div>' +
          '<p class="hintline">' + free.length + ' of ' + state.seats.length + ' seats still open.</p>'
        : '<div class="empty">All seats are assigned. Ask the Storyteller to start the game.</div>') +
      '<button class="demo-reset" type="button" data-act="reset">Reset demo (game state)</button>';
    focusFirst();
  }

  function renderRole() {
    var p = player();
    var s = shown(p);
    app.innerHTML =
      bar() +
      '<div>' +
      '<div class="timer" aria-hidden="true"><span id="timerbar"></span></div>' +
      '<p class="timer__text" id="timertext">Hides in ' + Math.ceil(remaining) + 's</p>' +
      '</div>' +
      '<article class="role" tabindex="-1" id="rolecard">' +
      '<p class="role__seat">Seat ' + p.seat + '</p>' +
      '<div class="role__art"><img src="../../web/build/img/roles/' + s.img + '" alt=""></div>' +
      '<h1 class="role__name">' + s.role + '</h1>' +
      '<p class="role__team"><i class="dot dot--' + s.team + '"></i>' + s.team + '</p>' +
      '<p class="role__ability">' + s.ability + '</p>' +
      '<p class="role__note">Only you can see this card.</p>' +
      '</article>' +
      '<form class="nameform" data-nameform>' +
      '<label for="player-name">Your name</label>' +
      '<input id="player-name" name="name" value="' + nameFor(p) + '" placeholder="Type your name" maxlength="24" autocomplete="off">' +
      '<button class="primary" type="submit" data-focus>Save and hide</button>' +
      '<button class="quiet" type="button" data-act="cancel">Cancel and pick another number</button>' +
      '</form>';
    startTimer();
    focusFirst();
  }

  function renderDone() {
    var p = player();
    var name = p ? nameFor(p) : "";
    app.innerHTML =
      bar() +
      '<section class="done">' +
      '<span class="done__mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12.5l5 5L20 6.5"/></svg></span>' +
      '<h1>Role hidden</h1>' +
      '<p>' + (name ? name + ' is seated at number ' + seat + '.' : 'Seat ' + seat + ' is taken.') +
      ' Hand the device back to the Storyteller.</p>' +
      '<button class="primary" type="button" data-act="next" data-focus>Pass to the next player</button>' +
      '<a class="quiet" href="workbench.html">Back to the grimoire</a>' +
      '</section>';
    focusFirst();
  }

  function focusFirst() {
    var el = app.querySelector("[data-focus]");
    if (el) el.focus({ preventScroll: true });
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function startTimer() {
    stopTimer();
    remaining = total;
    var barEl = document.getElementById("timerbar");
    var textEl = document.getElementById("timertext");
    barEl.style.transform = "scaleX(1)";
    timer = setInterval(function () {
      remaining = Math.max(0, +(remaining - 0.1).toFixed(1));
      barEl.style.transform = "scaleX(" + (remaining / total) + ")";
      textEl.textContent = "Hides in " + Math.ceil(remaining) + "s";
      if (remaining <= 0) {
        stopTimer();
        finish();
      }
    }, 100);
  }

  function finish() {
    stopTimer();
    page = "done";
    render();
  }

  function render() {
    app.dataset.page = page;
    if (page === "role" && !player()) { page = "numbers"; }
    if (page === "numbers") renderNumbers();
    else if (page === "role") renderRole();
    else renderDone();
  }

  app.addEventListener("click", function (e) {
    var seatBtn = e.target.closest("[data-seat]");
    if (seatBtn) {
      seat = Number(seatBtn.dataset.seat);
      var picked = state.seats.find(function (p) { return p.seat === seat; });
      if (!picked || taken(picked)) return;
      session[picked.id] = "";
      page = "role";
      render();
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "cancel") {
      stopTimer();
      var current = player();
      if (current) delete session[current.id];
      page = "numbers";
      render();
    } else if (act.dataset.act === "next") {
      page = "numbers";
      render();
    } else if (act.dataset.act === "reset") {
      PGStore.reset();
      state = PGStore.hydrate(window.GAME);
      session = {};
      seat = 0;
      page = "numbers";
      render();
    }
  });

  app.addEventListener("submit", function (e) {
    if (!e.target.matches("[data-nameform]")) return;
    e.preventDefault();
    var input = e.target.elements.name;
    var p = player();
    if (!p) return;
    var name = input.value.trim();
    session[p.id] = name;
    p.claimed = true;
    p.name = name;
    PGStore.savePlayer(p.id, { name: name, claimed: true });
    finish();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && page === "role") {
      stopTimer();
      var p = player();
      if (p) delete session[p.id];
      page = "numbers";
      render();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && page === "role") finish();
  });

  render();
})();
</script>
</body>
</html>
