<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger · Pocket Grimoire</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../web/fonts/inter/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #080a0c;
    --panel: #0e1215;
    --panel-2: #141a1e;
    --line: #1e262b;
    --line-2: #2a353c;
    --text: #dfe4e6;
    --muted: #7f8c93;
    --accent: #ff8a3d;
    --townsfolk: #58a6dc;
    --outsider: #6fbf8b;
    --minion: #e08545;
    --demon: #d95555;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Inter", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .label {
    font-size: 9.5px; font-weight: 650;
    letter-spacing: .13em; text-transform: uppercase; color: var(--muted);
  }
  .num { font-variant-numeric: tabular-nums; }
  /* top */
  .top {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .mark {
    font-size: 10px; letter-spacing: .08em;
    color: var(--accent);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    padding: 5px 6px;
  }
  .game { display: grid; line-height: 1.2; }
  .game b { font-size: 13px; font-weight: 600; }
  .game small { font-size: 10.5px; color: var(--muted); }
  .summary { display: flex; gap: 14px; margin-left: 8px; }
  .summary span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .teamdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .teamdot--Townsfolk { background: var(--townsfolk); }
  .teamdot--Outsider { background: var(--outsider); }
  .teamdot--Minion { background: var(--minion); }
  .teamdot--Demon { background: var(--demon); }
  .spacer { margin-left: auto; }
  .btn {
    border: 1px solid var(--line-2);
    background: var(--panel-2);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .btn:hover { background: #1b2328; }
  .btn--accent { background: #2c1a0d; border-color: #6a3d17; color: #ffc79b; }
  .btn--accent:hover { background: #382111; }
  /* toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--line);
    background: #0b0e11;
    flex-wrap: wrap;
  }
  .search {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-2);
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 9px;
    width: min(280px, 40vw);
  }
  .search input { border: 0; background: none; outline: none; width: 100%; font-size: 12px; }
  .search input::placeholder { color: #5f6c73; }
  .segmented { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; }
  .segmented button {
    border: 0; background: none;
    border-radius: 4px;
    padding: 4px 9px;
    font-size: 11px; color: var(--muted); cursor: pointer;
  }
  .segmented button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: 0 0 0 1px var(--line-2); }
  /* shell */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
  .tablewrap { overflow: auto; min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: #0b0e11;
    text-align: left;
    font-size: 9.5px; font-weight: 650;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-2);
    white-space: nowrap;
  }
  tbody tr { cursor: pointer; border-bottom: 1px solid var(--line); }
  tbody tr:hover { background: #10161a; }
  tbody tr[aria-selected="true"] { background: #171d21; box-shadow: inset 2px 0 0 var(--accent); }
  tbody tr.is-dead .player, tbody tr.is-dead .role { opacity: .5; }
  tbody tr.is-dead .player b { text-decoration: line-through; }
  td { padding: 8px 12px; vertical-align: middle; }
  .seat { width: 42px; color: var(--muted); font-size: 11px; }
  .player { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .player img { width: 30px; height: 30px; object-fit: contain; }
  .player b { display: block; font-size: 12.5px; font-weight: 550; }
  .player small { display: block; font-size: 10.5px; color: var(--muted); }
  .team { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #afbbc0; white-space: nowrap; }
  .state {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 2px 8px;
    color: #9fb6bf;
    white-space: nowrap;
  }
  .state--dead { border-color: #5a2b2b; color: #e0a1a1; }
  .state--shroud { border-color: #4c4630; color: #d9cb92; }
  .rems { display: flex; gap: 4px; flex-wrap: wrap; }
  .rem {
    font-size: 9.5px; color: #c0cbd0;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  .muted { color: var(--muted); font-size: 11px; }
  /* editor */
  .editor {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow: auto;
    padding: 16px;
  }
  .editor__art { display: grid; place-items: center; padding: 2px 0 6px; }
  .editor__art img { width: 128px; height: 128px; object-fit: contain; }
  .editor h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
  .editor__role { color: var(--accent); font-size: 11.5px; margin-top: 2px; }
  .editor__ability { color: #b8c2c7; font-size: 12px; margin: 12px 0 0; }
  .editor__actions { display: flex; gap: 6px; margin-top: 14px; }
  .editor__actions .btn { flex: 1; font-size: 11px; }
  .editor__section { margin-top: 20px; }
  .editor__section .label { display: block; margin-bottom: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .rem-edit {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .rem-edit button {
    margin-left: auto; border: 0; background: none;
    color: var(--muted); cursor: pointer; padding: 0 2px;
  }
  .rem-edit button:hover { color: var(--demon); }
  .remform { display: flex; gap: 6px; margin-top: 8px; }
  .remform input {
    flex: 1; min-width: 0;
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 11.5px;
  }
  textarea {
    width: 100%; min-height: 96px;
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    padding: 8px;
    font-size: 11.5px;
    resize: vertical;
  }
  /* night drawer */
  .drawer {
    position: fixed; inset: 0; z-index: 30;
    display: none;
    background: rgba(3, 5, 6, .65);
    padding: 8vh 4vw;
    place-items: start end;
  }
  .drawer[data-open="true"] { display: grid; }
  .drawer__panel {
    width: min(380px, 100%);
    max-height: 84vh;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 16px;
  }
  .drawer__head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .drawer__head h2 { margin: 0; font-size: 15px; }
  .drawer__head .btn { margin-left: auto; }
  .nightline {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .nightline img { width: 26px; height: 26px; object-fit: contain; }
  .nightline small { display: block; color: var(--muted); font-size: 10px; }
  .nightline input { margin-left: auto; accent-color: var(--accent); width: 15px; height: 15px; }
  /* privacy */
  .privacy {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    place-items: center;
    background: var(--bg);
    text-align: center;
  }
  .privacy[data-open="true"] { display: grid; }
  .privacy p { color: var(--muted); font-size: 12px; margin: 8px 0 16px; }
  .privacy b { font-size: 17px; font-weight: 600; }
  @media (max-width: 900px) {
    body { grid-template-rows: auto auto 1fr; height: auto; min-height: 100dvh; overflow: auto; }
    .summary { order: 4; width: 100%; margin: 0; padding-top: 8px; border-top: 1px solid var(--line); }
    .top { flex-wrap: wrap; }
    .shell { grid-template-columns: 1fr; }
    .editor { border-left: 0; border-top: 1px solid var(--line); }
    .editor__art img { width: 96px; height: 96px; }
    .tablewrap { overflow: visible; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      padding: 10px 12px;
      box-shadow: none;
    }
    tbody tr[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--accent); }
    td { padding: 0; }
    td.seat { grid-row: 1; grid-column: 2; text-align: right; width: auto; }
    td.player-cell { grid-row: 1; grid-column: 1; }
    td.team-cell { grid-row: 2; grid-column: 1; }
    td.state-cell { grid-row: 2; grid-column: 2; text-align: right; }
    td.rem-cell { grid-row: 3; grid-column: 1 / -1; margin-top: 4px; }
    td[data-label]::before { content: attr(data-label) " "; color: var(--muted); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    td.team-cell::before, td.state-cell::before { content: none; }
  }
  @media (max-width: 600px) {
    .search { width: 100%; }
    .segmented { width: 100%; }
    .segmented button { flex: 1; }
  }
</style>
</head>
<body>

<header class="top">
  <span class="mark">PG</span>
  <span class="game"><b>Grimoire Ledger</b><small>Trouble Brewing · <span id="head-night">Night 3</span></small></span>
  <div class="summary">
    <span><i class="teamdot teamdot--Townsfolk"></i>Townsfolk <b id="s-town"></b></span>
    <span><i class="teamdot teamdot--Minion"></i>Minions <b id="s-minion"></b></span>
    <span><i class="teamdot teamdot--Demon"></i>Demon <b id="s-demon"></b></span>
    <span>Alive <b id="s-alive"></b></span>
  </div>
  <div class="spacer"></div>
  <button class="btn" type="button" id="privacy-btn">Hide screen</button>
  <button class="btn btn--accent" type="button" id="night-btn">Night 3 order</button>
</header>

<div class="toolbar">
  <label class="search">
    <input id="search" type="search" placeholder="Filter seats, players, roles" aria-label="Filter seats, players, roles">
  </label>
  <div class="segmented" role="group" aria-label="State filter">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="alive" aria-pressed="false">Alive</button>
    <button type="button" data-filter="dead" aria-pressed="false">Dead</button>
    <button type="button" data-filter="evil" aria-pressed="false">Evil</button>
  </div>
  <span class="muted num" id="row-count" style="margin-left:auto"></span>
</div>

<div class="shell">
  <main class="tablewrap">
    <table>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Player</th>
          <th scope="col">Team</th>
          <th scope="col">State</th>
          <th scope="col">Reminders</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <aside class="editor" id="editor" aria-live="polite"></aside>
</div>

<div class="drawer" id="night-drawer" role="dialog" aria-modal="true" aria-labelledby="night-title">
  <div class="drawer__panel">
    <div class="drawer__head">
      <h2 id="night-title">Night 3 wake order</h2>
      <button class="btn" type="button" data-close-night>Close</button>
    </div>
    <div id="night-list"></div>
  </div>
</div>

<div class="privacy" id="privacy" role="dialog" aria-modal="true" aria-labelledby="privacy-title">
  <div>
    <b id="privacy-title">The screen is hidden</b>
    <p>Give the device to a player. The grimoire is not visible.</p>
    <button class="btn btn--accent" type="button" id="privacy-reveal">Show the grimoire</button>
  </div>
</div>

<script src="../../web/build/data/en_GB.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(function () {
  var state = JSON.parse(JSON.stringify(window.GAME));
  state = PGStore.hydrate(state);
  document.getElementById("head-night").textContent = "Night " + state.night;
  document.getElementById("night-btn").textContent = "Night " + state.night + " order";
  document.getElementById("night-title").textContent = "Night " + state.night + " wake order";
  var selected = 1;
  var filter = "all";
  var query = "";
  var rows = document.getElementById("rows");
  var editor = document.getElementById("editor");
  var nightList = document.getElementById("night-list");
  var drawer = document.getElementById("night-drawer");
  var privacy = document.getElementById("privacy");

  function img(p) { return "../../web/build/img/roles/" + p.img; }
  function bySeat(n) { return state.seats.find(function (p) { return p.seat === n; }); }
  function isEvil(p) { return p.team === "Minion" || p.team === "Demon"; }

  function visible(p) {
    var text = (p.name + " " + p.role + " " + p.team).toLowerCase();
    if (query && text.indexOf(query.toLowerCase()) === -1) return false;
    if (filter === "alive") return p.alive;
    if (filter === "dead") return !p.alive;
    if (filter === "evil") return isEvil(p);
    return true;
  }

  function renderSummary() {
    var count = function (team) { return state.seats.filter(function (p) { return p.team === team; }).length; };
    document.getElementById("s-town").textContent = count("Townsfolk");
    document.getElementById("s-minion").textContent = count("Minion");
    document.getElementById("s-demon").textContent = count("Demon");
    document.getElementById("s-alive").textContent = state.seats.filter(function (p) { return p.alive; }).length;
  }

  function renderRows() {
    var shown = state.seats.filter(visible);
    document.getElementById("row-count").textContent = shown.length + " of " + state.seats.length + " seats";
    rows.innerHTML = shown.map(function (p) {
      return '<tr data-seat="' + p.seat + '" aria-selected="' + (selected === p.seat) + '" class="' + (p.alive ? "" : "is-dead") + '">' +
        '<td class="seat num" data-label="Seat">' + String(p.seat).padStart(2, "0") + '</td>' +
        '<td class="player-cell"><span class="player"><img src="' + img(p) + '" alt="">' +
        '<span><b>' + p.name + '</b><small>' + p.role + '</small></span></span></td>' +
        '<td class="team-cell"><span class="team"><i class="teamdot teamdot--' + p.team + '"></i>' + p.team + '</span></td>' +
        '<td class="state-cell"><span class="state' + (p.alive ? "" : " state--dead") + '">' +
        (p.alive ? (p.shroud ? "Shrouded" : "Alive") : "Dead") + '</span></td>' +
        '<td class="rem-cell"><span class="rems">' +
        (p.reminders.length ? p.reminders.map(function (r) { return '<span class="rem">' + r + '</span>'; }).join("")
          : '<span class="muted">None</span>') + '</span></td></tr>';
    }).join("") || '<tr><td colspan="5" class="muted" style="padding:20px 12px">No seat matches this filter.</td></tr>';
  }

  function renderEditor() {
    var p = bySeat(selected);
    editor.innerHTML =
      '<div class="editor__art"><img src="' + img(p) + '" alt=""></div>' +
      '<h2>' + p.name + '</h2>' +
      '<div class="editor__role">Seat ' + p.seat + ' · ' + p.role + ' · ' + p.team + '</div>' +
      '<p class="editor__ability">' + p.ability + '</p>' +
      '<div class="editor__actions">' +
      '<button class="btn" type="button" data-act="alive">' + (p.alive ? "Mark dead" : "Revive") + '</button>' +
      '<button class="btn" type="button" data-act="shroud">' + (p.shroud ? "Remove shroud" : "Shroud") + '</button>' +
      '</div>' +
      '<div class="editor__section"><span class="label">Reminders</span>' +
      (p.reminders.length ? p.reminders.map(function (r, i) {
        return '<div class="rem-edit"><span>' + r + '</span><button type="button" aria-label="Remove ' + r + '" data-rem="' + i + '">x</button></div>';
      }).join("") : '<p class="muted" style="margin:0">No reminders on this seat.</p>') +
      '<form class="remform" data-remform><input aria-label="New reminder" placeholder="New reminder" maxlength="28"><button class="btn" type="submit">Add</button></form></div>' +
      '<div class="editor__section"><span class="label">Storyteller notes</span>' +
      '<textarea id="notes" aria-label="Storyteller notes"></textarea></div>';
    var notes = document.getElementById("notes");
    notes.value = state.notes;
    notes.addEventListener("input", function () {
      state.notes = notes.value;
      PGStore.save(state);
    });
  }

  function renderNight() {
    nightList.innerHTML = state.nightOrder.map(function (s, i) {
      var p = state.seats.find(function (seat) { return seat.role === s.role; });
      return '<label class="nightline"><input type="checkbox" data-step="' + i + '"' + (s.done ? " checked" : "") + '>' +
        (p ? '<img src="' + img(p) + '" alt="">' : "") +
        '<span>' + s.role + '<small>' + s.step + '</small></span></label>';
    }).join("");
  }

  function renderAll() {
    renderSummary(); renderRows(); renderEditor();
  }

  document.addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-seat]");
    if (tr) { selected = Number(tr.dataset.seat); renderAll(); return; }
    var filterBtn = e.target.closest("[data-filter]");
    if (filterBtn) {
      filter = filterBtn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.filter === filter));
      });
      renderRows();
      return;
    }
    var act = e.target.closest("[data-act]");
    if (act) {
      var p = bySeat(selected);
      if (act.dataset.act === "alive") p.alive = !p.alive;
      if (act.dataset.act === "shroud") p.shroud = !p.shroud;
      PGStore.save(state);
      renderAll();
      return;
    }
    var rem = e.target.closest("[data-rem]");
    if (rem) {
      bySeat(selected).reminders.splice(Number(rem.dataset.rem), 1);
      PGStore.save(state);
      renderAll();
    }
  });

  document.addEventListener("submit", function (e) {
    if (!e.target.matches("[data-remform]")) return;
    e.preventDefault();
    var p = bySeat(selected);
    var input = e.target.querySelector("input");
    if (!input.value.trim()) return;
    p.reminders.push(input.value.trim());
    PGStore.save(state);
    renderAll();
  });

  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value;
    renderRows();
  });

  document.getElementById("night-btn").addEventListener("click", function () {
    renderNight();
    drawer.dataset.open = "true";
  });
  document.querySelector("[data-close-night]").addEventListener("click", function () { drawer.dataset.open = "false"; });
  drawer.addEventListener("click", function (e) { if (e.target === drawer) drawer.dataset.open = "false"; });
  nightList.addEventListener("change", function (e) {
    if (!e.target.matches("[data-step]")) return;
    state.nightOrder[Number(e.target.dataset.step)].done = e.target.checked;
    PGStore.save(state);
  });

  document.getElementById("privacy-btn").addEventListener("click", function () {
    privacy.dataset.open = "true";
    document.getElementById("privacy-reveal").focus();
  });
  document.getElementById("privacy-reveal").addEventListener("click", function () {
    privacy.dataset.open = "false";
    document.getElementById("privacy-btn").focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    drawer.dataset.open = "false";
    privacy.dataset.open = "false";
  });

  renderAll();
})();
</script>
</body>
</html>
