<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round Table · Pocket Grimoire</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../web/fonts/inter/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #0e1216;
    --surface: #151c22;
    --surface-2: #1b242c;
    --line: #2a353f;
    --text: #e9e5db;
    --muted: #94a1ac;
    --accent: #d99a4e;
    --townsfolk: #58a6dc;
    --outsider: #6fbf8b;
    --minion: #e08545;
    --demon: #d95555;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 80% at 50% 0%, #182129 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 "Inter", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    min-height: 100dvh;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  .label {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 18, 22, .82);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand__mark {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    font-size: 11px; letter-spacing: .08em;
    color: var(--accent);
  }
  .brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .brand small { font-size: 11px; color: var(--muted); }
  .phase {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
  }
  .phase .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .phase span + span { color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 9px 14px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn--accent { border-color: #7d5a2e; background: #2a2114; color: #f1d3a4; }
  .btn--accent:hover { background: #342918; }
  .count {
    display: inline-block; margin-left: 8px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    font-size: 11px; font-variant-numeric: tabular-nums;
  }
  /* board */
  .board {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 10px;
  }
  .ring {
    position: relative;
    width: min(66vh, 720px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #1a242c 0%, #121920 60%, #0f1418 100%);
    border: 1px solid #222d36;
    box-shadow: inset 0 0 90px rgba(0, 0, 0, .55);
  }
  .ring::before {
    content: "";
    position: absolute; inset: 13%;
    border: 1px dashed #2e3b46;
    border-radius: 50%;
  }
  .seat {
    position: absolute;
    left: var(--x);
    top: var(--y);
    transform: translate(-50%, -50%);
    display: grid;
    justify-items: center;
    gap: 6px;
    width: 108px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .seat__disc {
    position: relative;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: #0b0f13;
    border: 1px solid #33414d;
    display: grid; place-items: center;
    transition: border-color .15s, box-shadow .15s;
  }
  .seat__disc img { width: 74px; height: 74px; object-fit: contain; }
  .seat:hover .seat__disc { border-color: #54626e; }
  .seat[aria-pressed="true"] .seat__disc {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 154, 78, .16);
  }
  .seat__num {
    position: absolute; left: -2px; top: -2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .seat__meta { display: grid; gap: 1px; justify-items: center; }
  .seat__name { font-size: 12px; font-weight: 550; line-height: 1.2; }
  .seat__role { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .seat__reminders {
    position: absolute; right: -6px; bottom: 16px;
    min-width: 20px; height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent);
    color: #1a130a;
    font-size: 10px; font-weight: 700;
    display: grid; place-items: center;
  }
  .seat.is-dead .seat__disc { opacity: .42; }
  .seat.is-dead .seat__disc::after {
    content: "";
    position: absolute; left: 18%; right: 18%; top: 50%;
    height: 2px; background: var(--demon); transform: rotate(-32deg);
  }
  .seat.is-dead .seat__name { color: var(--muted); text-decoration: line-through; }
  /* hub */
  .hub {
    position: absolute;
    z-index: 2;
    width: 300px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .4);
  }
  .hub__head { display: flex; align-items: baseline; gap: 8px; }
  .hub__seat { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hub__name { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .hub__role { margin-top: 2px; font-size: 12px; color: var(--accent); }
  .hub__ability { margin-top: 10px; font-size: 12.5px; color: #c6cdd3; }
  .hub__reminders { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .chip {
    font-size: 10.5px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: #c9d2d9;
  }
  .hub__actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .hub__actions .btn { padding: 6px 10px; font-size: 11.5px; }
  .reminder-form { display: flex; gap: 6px; margin-top: 10px; }
  .reminder-form input {
    flex: 1; min-width: 0;
    background: #0f1519;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    color: var(--text);
    font: inherit; font-size: 12px;
  }
  .reminder-form input::placeholder { color: #6f7b84; }
  .reminder-form .btn { padding: 6px 9px; font-size: 11.5px; }
  /* night rail */
  .nightrail {
    border-top: 1px solid var(--line);
    background: #10161b;
    padding: 10px 18px 14px;
  }
  .nightrail__head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .nightrail__head .label { margin-right: auto; }
  .steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .step {
    display: flex; align-items: center; gap: 8px;
    flex: 0 0 auto;
    padding: 6px 10px 6px 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 9px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .step img { width: 26px; height: 26px; object-fit: contain; }
  .step small { display: block; font-size: 10px; color: var(--muted); }
  .step[data-done="true"] { border-color: #3c5164; background: #16232d; color: #9fb6c6; }
  .step[data-done="true"] .step__tick { color: var(--accent); }
  .step__tick { width: 14px; text-align: center; color: #4a5863; }
  /* sheets */
  .sheet {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    background: rgba(5, 8, 10, .6);
    padding: 6vh 6vw;
  }
  .sheet[data-open="true"] { display: grid; place-items: start end; }
  .sheet__panel {
    width: min(440px, 100%);
    max-height: 88vh;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  .sheet__head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .sheet__head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sheet__head .btn { margin-left: auto; }
  .nightline {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid #222c34;
    font-size: 13px;
  }
  .nightline img { width: 30px; height: 30px; object-fit: contain; }
  .nightline input { accent-color: var(--accent); width: 16px; height: 16px; margin-left: auto; }
  .nightline small { display: block; color: var(--muted); font-size: 11px; }
  textarea {
    width: 100%;
    min-height: 180px;
    background: #0f1519;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    padding: 10px;
    font: inherit; font-size: 13px;
    resize: vertical;
  }
  .hint { color: var(--muted); font-size: 11.5px; margin: 8px 0 0; }
  @media (max-width: 900px) {
    body { grid-template-rows: auto auto 1fr auto; overflow: auto; }
    .topbar, .board, .nightrail { min-width: 0; width: 100%; }
    .brand small, .phase span + span { display: none; }
    .board { padding: 16px; }
    .ring {
      width: 100%;
      aspect-ratio: auto;
      border: 0;
      box-shadow: none;
      background: none;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .ring::before { display: none; }
    .seat {
      position: static;
      transform: none;
      width: auto;
      grid-auto-flow: row;
      grid-template-columns: 44px 1fr;
      align-items: center;
      justify-items: start;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      text-align: left;
    }
    .seat__disc { width: 44px; height: 44px; }
    .seat__disc img { width: 38px; height: 38px; }
    .seat__num { width: 16px; height: 16px; font-size: 8px; }
    .seat__reminders { position: static; justify-self: start; grid-column: 2; }
    .hub {
      position: static;
      width: auto;
      grid-column: 1 / -1;
      box-shadow: none;
    }
    .seat__meta { display: grid; gap: 1px; justify-items: start; }
    .nightrail { position: static; }
  }
  @media (max-width: 640px) {
    .topbar { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
    .phase { padding: 5px 10px; font-size: 11.5px; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
    .ring { grid-template-columns: 1fr; }
    .hub { order: 0; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand__mark">PG</span>
    <div><b>Trouble Brewing</b><small>Pocket Grimoire</small></div>
  </div>
  <div class="phase"><span class="dot"></span>Night <span id="phase-night">3</span><span class="phase__sub"><span id="phase-players">8</span> players</span></div>
  <div class="actions">
    <button class="btn" type="button" data-sheet="notes">Notes</button>
    <button class="btn btn--accent" type="button" data-sheet="night">Run night <span class="count" id="night-count">2/7</span></button>
  </div>
</header>

<main class="board">
  <div class="hub" id="hub" aria-live="polite"></div>
  <div class="ring" id="ring"></div>
</main>

<footer class="nightrail">
  <div class="nightrail__head">
    <span class="label">Tonight's order</span>
    <span class="hint" id="rail-hint">Tap a step to resolve it</span>
  </div>
  <div class="steps" id="steps"></div>
</footer>

<div class="sheet" id="notes-sheet" role="dialog" aria-modal="true" aria-labelledby="notes-title">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h2 id="notes-title">Storyteller notes</h2>
      <button class="btn" type="button" data-close>Close</button>
    </div>
    <textarea id="notes" aria-label="Storyteller notes"></textarea>
    <p class="hint">Saved in this prototype tab while it stays open.</p>
  </div>
</div>

<div class="sheet" id="night-sheet" role="dialog" aria-modal="true" aria-labelledby="night-title">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h2 id="night-title">Night 3 wake order</h2>
      <button class="btn" type="button" data-close>Close</button>
    </div>
    <div id="night-list"></div>
  </div>
</div>

<script src="../../web/build/data/en_GB.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(function () {
  var state = JSON.parse(JSON.stringify(window.GAME));
  state = PGStore.hydrate(state);
  document.getElementById("phase-night").textContent = state.night;
  document.getElementById("phase-players").textContent = state.seats.length;
  document.getElementById("night-title").textContent = "Night " + state.night + " wake order";
  var selected = 0;
  var ring = document.getElementById("ring");
  var hub = document.getElementById("hub");
  var steps = document.getElementById("steps");
  var nightList = document.getElementById("night-list");
  var nightCount = document.getElementById("night-count");
  var notes = document.getElementById("notes");
  var dt = 0;

  notes.value = state.notes;

  function placeSeats() {
    var radius = 40;
    state.seats.forEach(function (player, i) {
      var angle = -Math.PI / 2 + (i * 2 * Math.PI) / state.seats.length;
      var seat = document.createElement("button");
      seat.type = "button";
      seat.className = "seat";
      seat.style.setProperty("--x", (50 + radius * Math.cos(angle)) + "%");
      seat.style.setProperty("--y", (50 + radius * Math.sin(angle)) + "%");
      seat.dataset.index = i;
      seat.setAttribute("aria-pressed", "false");
      seat.innerHTML =
        '<span class="seat__disc"><img src="../../web/build/img/roles/' + player.img + '" alt="">' +
        '<span class="seat__num">' + player.seat + '</span></span>' +
        '<span class="seat__meta"><span class="seat__name">' + player.name + '</span>' +
        '<span class="seat__role">' + player.role + '</span></span>' +
        (player.reminders.length ? '<span class="seat__reminders" title="' + player.reminders.length + ' reminders">' + player.reminders.length + '</span>' : '');
      seat.addEventListener("click", function () { select(i); });
      ring.appendChild(seat);
    });
  }

  function seatEl(i) { return ring.querySelector('[data-index="' + i + '"]'); }

  function markSeats() {
    state.seats.forEach(function (player, i) {
      var el = seatEl(i);
      if (!el) return;
      el.setAttribute("aria-pressed", String(i === selected));
      el.classList.toggle("is-dead", !player.alive);
      el.classList.toggle("is-shroud", player.shroud);
    });
  }

  function renderHub() {
    var p = state.seats[selected];
    hub.innerHTML =
      '<div class="hub__head"><span class="hub__seat">SEAT ' + p.seat + '</span>' +
      '<span class="hub__name">' + p.name + '</span></div>' +
      '<div class="hub__role">' + p.role + ' · ' + p.team + '</div>' +
      '<p class="hub__ability">' + p.ability + '</p>' +
      '<div class="hub__reminders">' + (p.reminders.length
        ? p.reminders.map(function (r) { return '<span class="chip">' + r + '</span>'; }).join("")
        : '<span class="chip" style="color:#6f7b84">No reminders</span>') + '</div>' +
      '<div class="hub__actions">' +
      '<button class="btn" type="button" data-act="alive">' + (p.alive ? "Mark dead" : "Revive") + '</button>' +
      '<button class="btn" type="button" data-act="shroud">' + (p.shroud ? "Remove shroud" : "Shroud") + '</button>' +
      '</div>' +
      '<form class="reminder-form" data-act="reminder"><input aria-label="New reminder" placeholder="Add reminder" maxlength="28">' +
      '<button class="btn" type="submit">Add</button></form>';
  }

  function renderNight() {
    nightCount.textContent = state.nightOrder.filter(function (s) { return s.done; }).length + "/" + state.nightOrder.length;
    steps.innerHTML = state.nightOrder.map(function (step, i) {
      var player = state.seats.find(function (p) { return p.role === step.role; });
      return '<button class="step" type="button" data-step="' + i + '" data-done="' + step.done + '" aria-pressed="' + step.done + '">' +
        '<span class="step__tick">' + (step.done ? "✓" : "·") + '</span>' +
        (player ? '<img src="../../web/build/img/roles/' + player.img + '" alt="">' : '') +
        '<span>' + step.role + '<small>' + step.step + '</small></span></button>';
    }).join("");
    nightList.innerHTML = state.nightOrder.map(function (step, i) {
      var player = state.seats.find(function (p) { return p.role === step.role; });
      return '<label class="nightline"><input type="checkbox" data-step="' + i + '"' + (step.done ? " checked" : "") + '>' +
        (player ? '<img src="../../web/build/img/roles/' + player.img + '" alt="">' : '') +
        '<span>' + step.role + '<small>' + step.step + '</small></span></label>';
    }).join("");
  }

  function select(i) {
    selected = i;
    markSeats();
    renderHub();
  }

  function toggleStep(i) {
    state.nightOrder[i].done = !state.nightOrder[i].done;
    PGStore.save(state);
    renderNight();
  }

  hub.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var p = state.seats[selected];
    if (act.dataset.act === "alive") p.alive = !p.alive;
    if (act.dataset.act === "shroud") p.shroud = !p.shroud;
    PGStore.save(state);
    markSeats();
    renderHub();
  });

  hub.addEventListener("submit", function (e) {
    e.preventDefault();
    var input = e.target.querySelector("input");
    if (!input.value.trim()) return;
    state.seats[selected].reminders.push(input.value.trim());
    PGStore.save(state);
    markSeats();
    renderHub();
  });

  steps.addEventListener("click", function (e) {
    var b = e.target.closest("[data-step]");
    if (b) toggleStep(Number(b.dataset.step));
  });

  nightList.addEventListener("change", function (e) {
    if (e.target.matches("[data-step]")) toggleStep(Number(e.target.dataset.step));
  });

  document.querySelectorAll("[data-sheet]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var sheet = document.getElementById(btn.dataset.sheet + "-sheet");
      sheet.dataset.open = "true";
      (sheet.querySelector("textarea, input, button") || sheet).focus();
    });
  });

  document.querySelectorAll(".sheet").forEach(function (sheet) {
    sheet.addEventListener("click", function (e) {
      if (e.target === sheet || e.target.closest("[data-close]")) sheet.dataset.open = "false";
    });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      document.querySelectorAll('.sheet[data-open="true"]').forEach(function (s) { s.dataset.open = "false"; });
    }
  });

  notes.addEventListener("input", function () {
    state.notes = notes.value;
    PGStore.save(state);
  });

  placeSeats();
  select(0);
  renderNight();
})();
</script>
</body>
</html>
