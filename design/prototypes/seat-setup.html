<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seat order · Pocket Grimoire</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../web/fonts/inter/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #0a0d0f;
    --panel: #12171a;
    --panel-2: #171e22;
    --line: #263038;
    --line-2: #35424b;
    --text: #eae7df;
    --muted: #8b989f;
    --accent: #d8b06a;
    --accent-dim: #2c2416;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(80% 60% at 50% 0%, #141b1f 0%, var(--bg) 62%);
    color: var(--text);
    font: 14px/1.45 "Inter", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
  }
  button, input, a { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .label {
    font-size: 9.5px; font-weight: 650;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  /* top */
  .top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 13, 15, .85);
  }
  .title { display: grid; line-height: 1.2; margin-right: auto; }
  .title b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .title small { font-size: 10.5px; color: var(--muted); }
  .actions { display: flex; gap: 7px; }
  .btn {
    border: 1px solid var(--line-2);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { background: #1d252a; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn--accent { background: var(--accent-dim); border-color: #6d5730; color: #f2d9a9; }
  .btn--accent:hover { background: #382d19; }
  /* shell */
  .shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 304px;
    min-height: 0;
  }
  .stage {
    position: relative;
    grid-column: 1;
    grid-row: 1;
    display: grid;
    place-items: center;
    padding: 12px;
    min-height: 0;
  }
  .ring {
    position: relative;
    width: min(70vh, 580px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid #1f2a30;
    background: radial-gradient(circle at 50% 45%, #131b20 0%, #0d1215 62%, #0a0e10 100%);
    box-shadow: inset 0 0 80px rgba(0, 0, 0, .5);
  }
  .ring::before {
    content: "";
    position: absolute; inset: 15%;
    border: 1px dashed #253139;
    border-radius: 50%;
    pointer-events: none;
  }
  .ring.is-dense .seat { width: 88px; }
  .ring.is-dense .seat__disc { width: 54px; height: 54px; }
  .ring.is-dense .seat__mono { font-size: 19px; }
  .ring.is-dense .seat__name { font-size: 10px; }
  .hub {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 190px;
    text-align: center;
    pointer-events: none;
  }
  .hub__count {
    font-size: 34px; font-weight: 600;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  .hub__count span { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .hub__note { margin: 4px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.4; }
  .hub__arrow { margin-top: 10px; color: #5e6d75; }
  /* seat */
  .seat {
    position: absolute;
    left: var(--x);
    top: var(--y);
    transform: translate(-50%, -50%);
    width: 104px;
    display: grid;
    justify-items: center;
    gap: 5px;
    border: 0;
    background: none;
    padding: 0;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .seat:active { cursor: grabbing; }
  .seat__disc {
    position: relative;
    width: 66px; height: 66px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #1b2429, #12181c);
    border: 1px solid #35434c;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
    transition: border-color .15s, box-shadow .15s, opacity .15s;
  }
  .seat__mono {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 23px;
    color: #e9dfcb;
  }
  .seat__num {
    position: absolute;
    left: -3px; top: -3px;
    width: 21px; height: 21px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: #182126;
    border: 1px solid var(--line-2);
    font-size: 9.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .seat[data-index="0"] .seat__num { border-color: #6d5730; color: var(--accent); }
  .seat__name {
    max-width: 100%;
    font-size: 11.5px;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seat.is-empty { cursor: default; }
  .seat.is-empty .seat__disc {
    border-style: dashed;
    border-color: #33414a;
    background: transparent;
    box-shadow: none;
  }
  .seat.is-empty .seat__mono { font-size: 20px; color: #56656d; }
  .seat.is-empty .seat__name { color: #5f6d74; }
  .seat.is-selected .seat__disc {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(216, 176, 106, .14);
  }
  .seat.is-target .seat__disc {
    border-color: var(--accent);
    border-style: solid;
    background: #241e12;
    box-shadow: 0 0 0 4px rgba(216, 176, 106, .1);
  }
  .seat.is-dragging { opacity: .35; }
  .seat:not(.is-empty):hover .seat__disc { border-color: #4a5a64; }
  /* tray */
  .tray {
    grid-column: 2;
    grid-row: 1;
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 16px;
    overflow: auto;
    min-height: 0;
  }
  .tray__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .tray__head .label { margin-right: auto; }
  .tray__count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chips { display: grid; gap: 7px; }
  .chip {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line-2);
    background: var(--panel-2);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: left;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .chip:active { cursor: grabbing; }
  .chip:hover { background: #1d252a; }
  .chip__mono {
    width: 30px; height: 30px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid #35434c;
    background: #12181c;
    font-family: Georgia, serif;
    font-size: 13px;
    color: #e9dfcb;
  }
  .chip__name { font-size: 13px; }
  .grip {
    margin-left: auto;
    width: 10px; height: 16px;
    background-image: radial-gradient(currentColor 1px, transparent 1.4px);
    background-size: 5px 5px;
    color: #5b6a72;
  }
  .chip.is-selected { border-color: var(--accent); background: var(--accent-dim); }
  .chip.is-dragging { opacity: .35; }
  .chip.is-target { border-color: var(--line-2); }
  .tray__empty { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .tray__hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: #6b787f; font-size: 10.5px; line-height: 1.5; }
  .tray__reset {
    margin-top: 12px;
    border: 0; background: none;
    padding: 0;
    color: #5d696f;
    font-size: 10.5px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .tray__reset:hover { color: var(--muted); }
  .status { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); margin: 0; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .drag-ghost {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.04);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
    border-radius: 10px;
    opacity: .96;
  }
  .drag-ghost .grip { visibility: hidden; }
  @media (max-width: 860px) {
    body { grid-template-rows: auto auto 1fr; overflow: auto; height: auto; min-height: 100dvh; }
    .top { flex-wrap: wrap; gap: 8px; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .stage, .tray { grid-column: auto; grid-row: auto; }
    .tray {
      border-left: 0;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
    }
    .tray__head { margin-bottom: 8px; }
    .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
    .chip { flex: 0 0 auto; }
    .tray__hint { display: none; }
    .stage { padding: 8px 8px 28px; }
    .ring { width: min(94vw, 470px); }
    .seat { width: 82px; }
    .seat__disc { width: 54px; height: 54px; }
    .ring.is-dense .seat { width: 66px; }
    .ring.is-dense .seat__disc { width: 40px; height: 40px; }
    .ring.is-dense .seat__mono { font-size: 15px; }
    .ring.is-dense .seat__num { width: 16px; height: 16px; font-size: 8px; }
    .seat__mono { font-size: 19px; }
    .seat__name { font-size: 10.5px; }
    .hub { width: 150px; }
    .hub__count { font-size: 28px; }
    .hub__note { font-size: 9.5px; }
    .status { bottom: 4px; }
  }
  @media (max-width: 420px) {
    .ring { width: 92vw; }
    .seat { width: 74px; }
    .seat__disc { width: 48px; height: 48px; }
    .seat__mono { font-size: 17px; }
    .seat__name { font-size: 10px; }
    .seat__num { width: 18px; height: 18px; font-size: 8.5px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="title">
    <b>Seat order</b>
    <small>Trouble Brewing · <span id="player-count">8</span> players</small>
  </div>
  <div class="actions">
    <button class="btn" type="button" id="undo" disabled>Undo</button>
    <button class="btn" type="button" id="shuffle">Shuffle</button>
    <button class="btn btn--accent" type="button" id="use" disabled>Use this order</button>
  </div>
</header>

<main class="shell">
  <aside class="tray" id="tray" aria-label="Players without a seat">
    <div class="tray__head">
      <span class="label">Not seated</span>
      <span class="tray__count" id="tray-count">3</span>
    </div>
    <div class="chips" id="chips"></div>
    <p class="tray__empty" id="tray-empty" hidden>Everyone is seated.</p>
    <p class="tray__hint">Drag a name onto a seat, or tap a name then a seat. Drag one seat onto another to swap. Drag a seat here to unseat.</p>
    <button class="tray__reset" type="button" data-act="reset">Reset game (demo)</button>
  </aside>

  <section class="stage">
    <div class="ring" id="ring">
      <div class="hub">
        <div class="hub__count"><span id="seated-count">5</span> <span id="seat-total">/ 8 seated</span></div>
        <p class="hub__note">Seat 1 is the start.<br>Numbers run clockwise.</p>
        <svg class="hub__arrow" viewBox="0 0 60 60" width="42" height="42" aria-hidden="true">
          <path d="M44 30a14 14 0 1 1-4.1-9.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M40 13v8h-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <p class="status" id="status"></p>
  </section>
</main>

<p class="sr-only" role="status" aria-live="polite" id="live"></p>

<script src="../../web/build/data/en_GB.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(function () {
  var all = PGStore.hydrate(window.GAME).seats.map(function (p) {
    p.initial = p.name.charAt(0).toUpperCase();
    return p;
  });
  var hasOrder = !!PGStore.order();
  var seats = hasOrder ? all.slice() : all.slice(0, 5).concat([null, null, null]);
  var unseated = hasOrder ? [] : all.slice(5);
  var history = [];
  var selected = null; // {type:"tray", id} | {type:"seat", index}
  var ring = document.getElementById("ring");
  var chipsEl = document.getElementById("chips");
  var status = document.getElementById("status");
  var live = document.getElementById("live");
  var undoBtn = document.getElementById("undo");
  var useBtn = document.getElementById("use");

  function playerById(id) {
    return all.find(function (p) { return p.id === id; });
  }
  function findSeatIndex(id) {
    return seats.findIndex(function (p) { return p && p.id === id; });
  }
  function announce(text) {
    status.textContent = text;
    live.textContent = text;
  }
  function snapshot() {
    history.push({ seats: seats.slice(), unseated: unseated.slice() });
    undoBtn.disabled = false;
  }

  function initials(p) { return p.initial; }

  function renderRing() {
    var old = ring.querySelectorAll(".seat");
    old.forEach(function (el) { el.remove(); });
    ring.classList.toggle("is-dense", seats.length > 10);
    seats.forEach(function (p, i) {
      var angle = -Math.PI / 2 + (i * 2 * Math.PI) / seats.length;
      var el = document.createElement("button");
      el.type = "button";
      el.className = "seat" + (p ? "" : " is-empty");
      el.style.setProperty("--x", (50 + 40 * Math.cos(angle)) + "%");
      el.style.setProperty("--y", (50 + 40 * Math.sin(angle)) + "%");
      el.dataset.seat = String(i);
      if (p) el.dataset.player = p.id;
      el.setAttribute("aria-label", p ? p.name + ", seat " + (i + 1) : "Seat " + (i + 1) + ", empty");
      el.innerHTML =
        '<span class="seat__disc"><span class="seat__num">' + (i + 1) + '</span>' +
        '<span class="seat__mono">' + (p ? initials(p) : "+") + '</span></span>' +
        '<span class="seat__name">' + (p ? p.name : "Drop a name") + '</span>';
      if (selected && selected.type === "seat" && selected.index === i) el.classList.add("is-selected");
      if (drag && drag.source === "seat" && drag.index === i) el.classList.add("is-dragging");
      ring.appendChild(el);
    });
  }

  function renderTray() {
    chipsEl.innerHTML = "";
    unseated.forEach(function (p) {
      var el = document.createElement("button");
      el.type = "button";
      el.className = "chip";
      el.dataset.player = p.id;
      el.setAttribute("aria-label", p.name + ", not seated. Tap to pick, then tap a seat.");
      if (selected && selected.type === "tray" && selected.id === p.id) el.classList.add("is-selected");
      if (drag && drag.source === "tray" && drag.id === p.id) el.classList.add("is-dragging");
      el.innerHTML = '<span class="chip__mono">' + p.initial + '</span>' +
        '<span class="chip__name">' + p.name + '</span><span class="grip" aria-hidden="true"></span>';
      chipsEl.appendChild(el);
    });
    document.getElementById("tray-count").textContent = String(unseated.length);
    document.getElementById("tray-empty").hidden = unseated.length > 0;
    document.getElementById("seated-count").textContent =
      String(seats.filter(Boolean).length);
    document.getElementById("seat-total").textContent = "/ " + seats.length + " seated";
    document.getElementById("player-count").textContent = String(all.length);
    useBtn.disabled = !(unseated.length === 0 && seats.every(Boolean));
  }

  function render() {
    renderRing();
    renderTray();
  }

  function clearSelected() {
    selected = null;
  }

  function placeInSeat(player, index) {
    snapshot();
    var displaced = seats[index];
    seats[index] = player;
    unseated = unseated.filter(function (p) { return p.id !== player.id; });
    if (displaced) unseated.push(displaced);
    announce(player.name + " takes seat " + (index + 1) + ".");
    clearSelected();
    render();
  }

  function swapSeats(from, to) {
    if (from === to) { clearSelected(); render(); return; }
    snapshot();
    var a = seats[from];
    seats[from] = seats[to];
    seats[to] = a;
    announce((seats[to] ? seats[to].name : "Empty seat") + " now sits at " + (to + 1) + ".");
    clearSelected();
    render();
  }

  function unseat(index) {
    if (!seats[index]) return;
    snapshot();
    var p = seats[index];
    seats[index] = null;
    unseated.push(p);
    announce(p.name + " is no longer seated.");
    clearSelected();
    render();
  }

  function onSeatActivate(index) {
    if (selected) {
      if (selected.type === "tray") {
        var p = playerById(selected.id);
        if (p) placeInSeat(p, index);
      } else if (selected.type === "seat") {
        if (selected.index === index) { clearSelected(); render(); }
        else swapSeats(selected.index, index);
      }
      return;
    }
    if (seats[index]) {
      selected = { type: "seat", index: index };
      render();
    }
  }

  function onChipActivate(id) {
    if (selected) {
      if (selected.type === "seat") {
        var p = playerById(id);
        var target = selected.index;
        var displaced = seats[target];
        if (p) {
          snapshot();
          seats[target] = p;
          unseated = unseated.filter(function (x) { return x.id !== id; });
          if (displaced) unseated.push(displaced);
          announce(p.name + " takes seat " + (target + 1) + ".");
        }
        clearSelected();
        render();
        return;
      }
      if (selected.type === "tray" && selected.id === id) { clearSelected(); render(); return; }
    }
    selected = { type: "tray", id: id };
    render();
  }

  // drag
  var drag = null;

  function startDrag(e) {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    suppressClick = false;
    var chip = e.target.closest(".chip");
    var seat = e.target.closest(".seat");
    if (!chip && !seat) return;
    if (seat && seat.classList.contains("is-empty")) return;
    drag = {
      pointerId: e.pointerId,
      source: chip ? "tray" : "seat",
      id: chip ? chip.dataset.player : seat.dataset.player,
      index: seat ? Number(seat.dataset.seat) : null,
      startX: e.clientX,
      startY: e.clientY,
      x: e.clientX,
      y: e.clientY,
      active: false,
      origin: chip || seat,
      ghost: null,
      targetSeat: null
    };
  }

  function beginDrag() {
    drag.active = true;
    var ghost = drag.origin.cloneNode(true);
    ghost.classList.add("drag-ghost");
    ghost.classList.remove("is-selected");
    ghost.removeAttribute("id");
    ghost.style.left = drag.x + "px";
    ghost.style.top = drag.y + "px";
    ghost.style.width = drag.origin.getBoundingClientRect().width + "px";
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.origin.classList.add("is-dragging");
    document.body.style.cursor = "grabbing";
  }

  function moveDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.x = e.clientX;
    drag.y = e.clientY;
    if (!drag.active) {
      var dist = Math.hypot(drag.x - drag.startX, drag.y - drag.startY);
      if (dist < 6) return;
      beginDrag();
    }
    e.preventDefault();
    drag.ghost.style.left = drag.x + "px";
    drag.ghost.style.top = drag.y + "px";
    var under = document.elementFromPoint(drag.x, drag.y);
    var seatEl = under && under.closest(".seat");
    var next = seatEl ? Number(seatEl.dataset.seat) : null;
    if (next !== drag.targetSeat) {
      if (drag.targetSeat !== null) {
        var old = ring.querySelector('.seat[data-seat="' + drag.targetSeat + '"]');
        if (old) old.classList.remove("is-target");
      }
      drag.targetSeat = next;
      if (seatEl) seatEl.classList.add("is-target");
    }
  }

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    var d = drag;
    drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.origin) d.origin.classList.remove("is-dragging");
    document.body.style.cursor = "";
    if (!d.active) return;
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var seatEl = under && under.closest(".seat");
    var trayEl = under && under.closest("#tray");
    var index = seatEl ? Number(seatEl.dataset.seat) : null;

    if (index !== null) {
      if (d.source === "tray") {
        placeInSeat(playerById(d.id), index);
      } else {
        swapSeats(d.index, index);
      }
    } else if (trayEl && d.source === "seat") {
      unseat(d.index);
    } else {
      clearSelected();
      render();
    }
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 400);
  }

  var suppressClick = false;

  ring.addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; return; }
    var seat = e.target.closest(".seat");
    if (seat) onSeatActivate(Number(seat.dataset.seat));
  });

  chipsEl.addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; return; }
    var chip = e.target.closest(".chip");
    if (chip) onChipActivate(chip.dataset.player);
  });

  document.addEventListener("pointerdown", startDrag);
  document.addEventListener("pointermove", moveDrag, { passive: false });
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", function () {
    if (drag) {
      if (drag.ghost) drag.ghost.remove();
      drag = null;
      render();
    }
  });

  document.getElementById("undo").addEventListener("click", function () {
    var last = history.pop();
    if (!last) return;
    seats = last.seats;
    unseated = last.unseated;
    clearSelected();
    undoBtn.disabled = history.length === 0;
    announce("Undone.");
    render();
  });

  document.getElementById("shuffle").addEventListener("click", function () {
    snapshot();
    var pool = seats.filter(Boolean).concat(unseated);
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    seats = pool.slice(0, seats.length);
    unseated = pool.slice(seats.length);
    clearSelected();
    announce("Seats shuffled.");
    render();
  });

  useBtn.addEventListener("click", function () {
    if (useBtn.disabled) return;
    PGStore.setOrder(seats.map(function (p) { return p.id; }));
    announce("Seat order saved. Opening the grimoire.");
    window.location.href = "workbench.html";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && selected) {
      clearSelected();
      render();
    }
  });

  document.addEventListener("click", function (e) {
    if (e.target.closest('[data-act="reset"]')) {
      PGStore.reset();
      window.location.reload();
    }
  });

  render();
})();
</script>
</body>
</html>
