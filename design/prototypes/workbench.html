<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench · Pocket Grimoire</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../web/fonts/inter/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #0c0f11;
    --panel: #121619;
    --panel-2: #171d21;
    --line: #232b30;
    --text: #e6e8e4;
    --muted: #8a969c;
    --accent: #5fd0b4;
    --townsfolk: #58a6dc;
    --outsider: #6fbf8b;
    --minion: #e08545;
    --demon: #d95555;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Inter", system-ui, sans-serif;
    display: grid;
    grid-template-rows: 54px 1fr 30px;
    grid-template-columns: minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .label {
    font-size: 10px; font-weight: 650;
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  /* header */
  .head {
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .mark {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--accent); font-size: 10px; letter-spacing: .06em;
  }
  .head__game { display: grid; line-height: 1.2; margin-right: 4px; }
  .head__game b { font-size: 13px; font-weight: 600; }
  .head__game small { font-size: 10.5px; color: var(--muted); }
  .search {
    display: flex; align-items: center; gap: 7px;
    margin-left: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    width: min(260px, 34vw);
  }
  .search input {
    border: 0; background: none; outline: none;
    width: 100%; font-size: 12.5px;
  }
  .search input::placeholder { color: #6c787e; }
  .search kbd {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { border-color: #34414a; background: #1c2429; }
  .btn--accent { background: #10322c; border-color: #1f5a4f; color: #a7ebd9; }
  .btn--accent:hover { background: #143c35; }
  /* shell */
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr) 316px; min-height: 0; }
  .rail {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .rail__head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
  }
  .rail__head .label { margin-right: auto; }
  .rail__count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rail__list { overflow: auto; padding: 0 8px 10px; }
  .row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .row:hover { background: var(--panel-2); }
  .row[aria-pressed="true"] { background: #16211f; border-color: #24483f; }
  .row img { width: 32px; height: 32px; object-fit: contain; }
  .row__name { display: block; font-size: 12.5px; }
  .row__role { display: block; font-size: 10.5px; color: var(--muted); }
  .row__seat { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row.is-dead { opacity: .45; }
  .row.is-dead .row__name { text-decoration: line-through; }
  .bluffs { display: flex; gap: 6px; }
  .bluffs img { width: 30px; height: 30px; object-fit: contain; }
  /* canvas */
  .canvas {
    min-width: 0;
    display: flex; flex-direction: column;
    background:
      radial-gradient(90% 70% at 50% 0%, #141c21 0%, #0b0e10 70%);
    min-height: 0;
  }
  .canvas__bar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
  }
  .canvas__bar .label { margin-right: auto; }
  .legend { display: flex; gap: 10px; font-size: 10.5px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .teamdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .teamdot--Townsfolk { background: var(--townsfolk); }
  .teamdot--Outsider { background: var(--outsider); }
  .teamdot--Minion { background: var(--minion); }
  .teamdot--Demon { background: var(--demon); }
  .board {
    flex: 1;
    overflow: auto;
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
    gap: 10px;
    align-content: start;
  }
  .token {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 2px;
    padding: 14px 10px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: linear-gradient(180deg, #141b1f, #101518);
    cursor: pointer;
    text-align: center;
    min-height: 168px;
  }
  .token:hover { border-color: #34434a; }
  .token[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .token__seat {
    position: absolute; left: 8px; top: 6px;
    font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .token__state {
    position: absolute; right: 8px; top: 7px;
    font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--minion);
  }
  .token img { width: 74px; height: 74px; object-fit: contain; margin-top: 4px; }
  .token__name { font-size: 12.5px; font-weight: 550; }
  .token__role { font-size: 10.5px; color: var(--muted); }
  .token__reminders { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px; }
  .mini {
    font-size: 9.5px; color: #b9c6cc;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 6px;
  }
  .token.is-dead img { opacity: .35; filter: grayscale(1); }
  .token.is-dead .token__name { color: var(--muted); text-decoration: line-through; }
  .bluffbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    border-top: 1px solid var(--line);
    background: #0d1215;
  }
  .bluffbar__hint { margin-left: auto; font-size: 10.5px; color: #647078; }
  /* inspector */
  .inspector {
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1;
    border: 0; background: none;
    padding: 11px 6px;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .insp { overflow: auto; padding: 16px; }
  .insp__art { display: grid; place-items: center; padding: 4px 0 8px; }
  .insp__art img { width: 124px; height: 124px; object-fit: contain; }
  .insp h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
  .insp__role { color: var(--accent); font-size: 12px; margin-top: 2px; }
  .insp__ability { color: #c3ccd1; font-size: 12.5px; margin: 12px 0 0; }
  .insp__actions { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .insp__actions .btn { flex: 1; font-size: 11.5px; }
  .insp__section { margin-top: 18px; }
  .insp__section .label { display: block; margin-bottom: 7px; }
  .rem-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .rem-list li {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
  }
  .rem-list input { accent-color: var(--accent); }
  .rem-form { display: flex; gap: 6px; margin-top: 8px; }
  .rem-form input {
    flex: 1; min-width: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    padding: 7px 9px;
    font-size: 12px;
  }
  textarea {
    width: 100%; min-height: 220px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    padding: 10px;
    font-size: 12.5px;
    resize: vertical;
  }
  .note-meta { color: var(--muted); font-size: 11px; margin-top: 8px; }
  /* status */
  .status {
    display: flex; align-items: center; gap: 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 0 14px;
    font-size: 10.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .status b { color: #b7c5ca; font-weight: 550; }
  .status .right { margin-left: auto; }
  /* night sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(4, 7, 8, .55);
    display: none;
    justify-items: end;
  }
  .sheet[data-open="true"] { display: grid; }
  .sheet__panel {
    width: min(400px, 100%);
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 16px;
    overflow: auto;
  }
  .sheet__head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sheet__head h2 { margin: 0; font-size: 16px; }
  .sheet__head .btn { margin-left: auto; }
  .nightline {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .nightline img { width: 28px; height: 28px; object-fit: contain; }
  .nightline small { display: block; color: var(--muted); font-size: 10.5px; }
  .nightline input { margin-left: auto; accent-color: var(--accent); width: 16px; height: 16px; }
  @media (max-width: 1040px) {
    body { grid-template-rows: auto auto 1fr; overflow: auto; height: auto; min-height: 100dvh; }
    .head, .shell, .status { min-width: 0; width: 100%; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail, .canvas, .inspector { min-width: 0; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); }
    .rail__list { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 10px; }
    .row { flex: 0 0 auto; width: auto; border: 1px solid var(--line); }
    .canvas { min-height: 420px; }
    .inspector { border-left: 0; border-top: 1px solid var(--line); }
    .insp { padding-bottom: 24px; }
    .status { position: static; }
  }
  @media (max-width: 640px) {
    .head { flex-wrap: wrap; padding: 8px 10px; gap: 8px; height: auto; }
    .search { order: 3; width: 100%; margin-left: 0; }
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; }
    .token { min-height: 148px; }
    .token img { width: 60px; height: 60px; }
    .canvas__bar { padding: 8px 10px; }
    .legend { display: none; }
    .bluffbar__hint { display: none; }
    .insp__art img { width: 96px; height: 96px; }
  }
</style>
</head>
<body>

<header class="head">
  <span class="mark">PG</span>
  <span class="head__game"><b>Trouble Brewing</b><small><span id="head-night">Night 3</span> · <span id="head-players">8</span> players</small></span>
  <label class="search">
    <input id="search" type="search" placeholder="Find player or role" aria-label="Find player or role">
    <kbd>/</kbd>
  </label>
  <button class="btn btn--accent" type="button" data-open-night>Run night</button>
</header>

<div class="shell">
  <aside class="rail" aria-label="Seats">
    <div class="rail__head">
      <span class="label">Seats</span>
      <span class="rail__count" id="rail-count"></span>
    </div>
    <div class="rail__list" id="rail-list"></div>
  </aside>

  <main class="canvas">
    <div class="canvas__bar">
      <span class="label">The grimoire</span>
      <div class="legend">
        <span><i class="teamdot teamdot--Townsfolk"></i>Townsfolk</span>
        <span><i class="teamdot teamdot--Outsider"></i>Outsider</span>
        <span><i class="teamdot teamdot--Minion"></i>Minion</span>
        <span><i class="teamdot teamdot--Demon"></i>Demon</span>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="bluffbar">
      <span class="label">Demon bluffs</span>
      <div class="bluffs" id="bluffs"></div>
      <span class="bluffbar__hint">Not in play, shown to the Demon</span>
    </div>
  </main>

  <aside class="inspector" aria-label="Inspector">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="role" aria-selected="true">Role</button>
      <button class="tab" type="button" role="tab" data-tab="reminders" aria-selected="false">Reminders</button>
      <button class="tab" type="button" role="tab" data-tab="notes" aria-selected="false">Notes</button>
    </div>
    <div class="insp" id="insp"></div>
  </aside>
</div>

<footer class="status">
  <span><b id="st-alive">0</b> alive</span>
  <span><b id="st-dead">0</b> dead</span>
  <span>Night <b id="st-night">3</b></span>
  <span class="right">Autosaving</span>
</footer>

<div class="sheet" id="night-sheet" role="dialog" aria-modal="true" aria-labelledby="night-title">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h2 id="night-title">Night 3</h2>
      <button class="btn" type="button" data-close-night>Close</button>
    </div>
    <p class="note-meta" id="night-progress"></p>
    <div id="night-list"></div>
  </div>
</div>

<script src="../../web/build/data/en_GB.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(function () {
  var state = JSON.parse(JSON.stringify(window.GAME));
  state = PGStore.hydrate(state);
  document.getElementById("head-night").textContent = "Night " + state.night;
  document.getElementById("head-players").textContent = state.seats.length;
  document.getElementById("night-title").textContent = "Night " + state.night;
  var selected = 1;
  var tab = "role";
  var query = "";
  var board = document.getElementById("board");
  var railList = document.getElementById("rail-list");
  var insp = document.getElementById("insp");
  var nightList = document.getElementById("night-list");
  var nightSheet = document.getElementById("night-sheet");

  document.getElementById("bluffs").innerHTML = state.bluffs.map(function (b) {
    return '<img src="../../web/build/img/roles/' + b.img + '" alt="' + b.role + '" title="' + b.role + '">';
  }).join("");

  function img(p) { return "../../web/build/img/roles/" + p.img; }
  function matches(p) {
    return (p.name + " " + p.role).toLowerCase().indexOf(query.toLowerCase()) !== -1;
  }
  function aliveCount() { return state.seats.filter(function (p) { return p.alive; }).length; }

  function renderRail() {
    railList.innerHTML = state.seats.filter(matches).map(function (p) {
      return '<button class="row' + (p.alive ? "" : " is-dead") + '" type="button" data-seat="' + p.seat + '" aria-pressed="' + (selected === p.seat) + '">' +
        '<img src="' + img(p) + '" alt="">' +
        '<span><span class="row__name">' + p.name + '</span><span class="row__role">' + p.role + '</span></span>' +
        '<span class="row__seat">' + p.seat + '</span></button>';
    }).join("") || '<p class="note-meta">No seat matches.</p>';
    document.getElementById("rail-count").textContent = state.seats.length + " total";
  }

  function renderBoard() {
    board.innerHTML = state.seats.filter(matches).map(function (p) {
      return '<button class="token' + (p.alive ? "" : " is-dead") + '" type="button" data-seat="' + p.seat + '" aria-pressed="' + (selected === p.seat) + '">' +
        '<span class="token__seat">' + p.seat + '</span>' +
        (p.alive ? "" : '<span class="token__state">Dead</span>') +
        '<img src="' + img(p) + '" alt="">' +
        '<span class="token__name">' + p.name + '</span>' +
        '<span class="token__role">' + p.role + '</span>' +
        '<span class="token__reminders">' + p.reminders.slice(0, 2).map(function (r) { return '<span class="mini">' + r + '</span>'; }).join("") + '</span>' +
        '</button>';
    }).join("") || '<p class="note-meta">No token matches.</p>';
  }

  function renderInspector() {
    var p = state.seats.find(function (s) { return s.seat === selected; });
    if (tab === "role") {
      insp.innerHTML =
        '<div class="insp__art"><img src="' + img(p) + '" alt=""></div>' +
        '<h2>' + p.name + '</h2>' +
        '<div class="insp__role">Seat ' + p.seat + ' · ' + p.role + ' · ' + p.team + '</div>' +
        '<p class="insp__ability">' + p.ability + '</p>' +
        '<div class="insp__actions">' +
        '<button class="btn" type="button" data-act="alive">' + (p.alive ? "Mark dead" : "Revive") + '</button>' +
        '<button class="btn" type="button" data-act="shroud">' + (p.shroud ? "Remove shroud" : "Shroud") + '</button>' +
        '</div>' +
        '<div class="insp__section"><span class="label">Reminders</span>' +
        (p.reminders.length ? p.reminders.map(function (r) { return '<span class="mini" style="margin-right:4px">' + r + '</span>'; }).join("")
          : '<span class="note-meta">None yet.</span>') + '</div>';
    } else if (tab === "reminders") {
      insp.innerHTML =
        '<h2 style="font-size:15px">Reminders · ' + p.name + '</h2>' +
        '<ul class="rem-list">' + (p.reminders.length ? p.reminders.map(function (r, i) {
          return '<li><input type="checkbox" aria-label="Clear ' + r + '" data-rem="' + i + '"><span>' + r + '</span></li>';
        }).join("") : '<li style="color:#8a969c">No reminders on this seat.</li>') + '</ul>' +
        '<form class="rem-form" data-rem-form><input aria-label="New reminder" placeholder="New reminder" maxlength="28"><button class="btn" type="submit">Add</button></form>';
    } else {
      insp.innerHTML =
        '<h2 style="font-size:15px">Storyteller notes</h2>' +
        '<p class="note-meta">Private to this device.</p>' +
        '<textarea id="notes" aria-label="Storyteller notes"></textarea>' +
        '<p class="note-meta">Autosaved with the game.</p>';
      var area = document.getElementById("notes");
      area.value = state.notes;
      area.addEventListener("input", function () {
        state.notes = area.value;
        PGStore.save(state);
      });
    }
  }

  function renderStatus() {
    var alive = aliveCount();
    document.getElementById("st-alive").textContent = alive;
    document.getElementById("st-dead").textContent = state.seats.length - alive;
    document.getElementById("st-night").textContent = state.night;
  }

  function renderNight() {
    var done = state.nightOrder.filter(function (s) { return s.done; }).length;
    document.getElementById("night-progress").textContent = done + " of " + state.nightOrder.length + " wakes resolved";
    nightList.innerHTML = state.nightOrder.map(function (step, i) {
      var p = state.seats.find(function (s) { return s.role === step.role; });
      return '<label class="nightline"><input type="checkbox" data-step="' + i + '"' + (step.done ? " checked" : "") + '>' +
        (p ? '<img src="' + img(p) + '" alt="">' : "") +
        '<span>' + step.role + '<small>' + step.step + '</small></span></label>';
    }).join("");
  }

  function renderAll() {
    renderRail(); renderBoard(); renderInspector(); renderStatus();
  }

  function select(seat) {
    selected = seat;
    renderAll();
  }

  document.addEventListener("click", function (e) {
    var seatBtn = e.target.closest("[data-seat]");
    if (seatBtn) { select(Number(seatBtn.dataset.seat)); return; }
    var tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) {
      tab = tabBtn.dataset.tab;
      document.querySelectorAll("[data-tab]").forEach(function (t) {
        t.setAttribute("aria-selected", String(t.dataset.tab === tab));
      });
      renderInspector();
      return;
    }
    var act = e.target.closest("[data-act]");
    if (act) {
      var p = state.seats.find(function (s) { return s.seat === selected; });
      if (act.dataset.act === "alive") p.alive = !p.alive;
      if (act.dataset.act === "shroud") p.shroud = !p.shroud;
      PGStore.save(state);
      renderAll();
      return;
    }
    if (e.target.closest("[data-open-night]")) { nightSheet.dataset.open = "true"; return; }
    if (e.target.closest("[data-close-night]") || e.target === nightSheet) { nightSheet.dataset.open = "false"; }
  });

  document.addEventListener("change", function (e) {
    if (e.target.matches("[data-step]")) {
      state.nightOrder[Number(e.target.dataset.step)].done = e.target.checked;
      PGStore.save(state);
      renderNight();
    }
    if (e.target.matches("[data-rem]")) {
      var p = state.seats.find(function (s) { return s.seat === selected; });
      p.reminders.splice(Number(e.target.dataset.rem), 1);
      PGStore.save(state);
      renderAll();
    }
  });

  document.addEventListener("submit", function (e) {
    if (!e.target.matches("[data-rem-form]")) return;
    e.preventDefault();
    var input = e.target.querySelector("input");
    var p = state.seats.find(function (s) { return s.seat === selected; });
    if (!input.value.trim()) return;
    p.reminders.push(input.value.trim());
    PGStore.save(state);
    renderAll();
  });

  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value;
    renderRail(); renderBoard();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
      e.preventDefault();
      document.getElementById("search").focus();
    }
    if (e.key === "Escape") nightSheet.dataset.open = "false";
  });

  renderAll();
  renderNight();
})();
</script>
</body>
</html>
