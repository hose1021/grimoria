<!doctype html>
<meta charset="utf-8">
<title>Pocket Grimoire</title>
<script>
  // Static hosts answer an unknown path with this file. Keep the requested
  // route, load the app shell, and let the router restore it.
  try { sessionStorage.setItem("pg.redirect", location.pathname + location.search); } catch (error) { /* private mode */ }
  location.replace(new URL("./", location.href));
</script>
