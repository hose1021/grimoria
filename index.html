<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b0e">
<title>Grimoria</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<output id="storage-status" class="sticky top-0 z-[200] block bg-alert-surface p-3 text-[14px] text-alert-ink" role="alert" hidden></output>
<aside id="update-banner" class="fixed inset-x-3 bottom-[calc(12px+env(safe-area-inset-bottom))] z-[250] flex flex-col gap-2.5 rounded-[10px] border border-line-2 bg-banner-surface p-3.5 shadow-[0_12px_32px_rgba(0,0,0,.55)] min-[720px]:inset-x-auto min-[720px]:right-[18px] min-[720px]:bottom-[18px] min-[720px]:w-[420px]" role="status" aria-live="polite" hidden>
  <p id="update-message" class="m-0"></p>
  <div class="flex gap-2">
    <button type="button" class="inline-flex min-h-11 flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-btn-accent-border bg-accent-dim px-3 py-2 text-[14px] leading-[1.45] text-btn-accent-text no-underline hover:bg-btn-accent-hover disabled:cursor-not-allowed disabled:opacity-40" id="update-now"></button>
    <button type="button" class="inline-flex min-h-11 flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-line-2 bg-panel-2 px-3 py-2 text-[14px] leading-[1.45] no-underline hover:bg-btn-hover disabled:cursor-not-allowed disabled:opacity-40" id="update-later"></button>
  </div>
</aside>
<main id="screen" class="min-h-dvh"></main>
<noscript>Grimoria needs JavaScript.</noscript>
<script src="%BASE_URL%assets/data/ru_RU.js"></script>
<script type="module" src="src/entry/main.ts"></script>
</body>
</html>
