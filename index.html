<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071017">
<title>Grimoria</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/bag.css">
<link rel="stylesheet" href="css/seat.css">
<link rel="stylesheet" href="css/setup.css">
</head>
<body class="isolate bg-bg bg-[radial-gradient(42rem_27rem_at_78%_0%,rgba(56,146,172,.13),transparent_72%),radial-gradient(34rem_23rem_at_14%_18%,rgba(26,78,96,.16),transparent_76%),linear-gradient(180deg,#09161c_0%,#071017_68%)] text-text">
<output id="storage-status" class="storage-status" role="alert" hidden></output>
<aside id="update-banner" class="update-banner" role="status" aria-live="polite" hidden>
  <p id="update-message"></p>
  <div class="update-actions">
    <button type="button" class="btn btn--accent" id="update-now"></button>
    <button type="button" class="btn" id="update-later"></button>
  </div>
</aside>
<main id="screen"></main>
<output id="offline-status" class="offline-status" aria-live="polite"></output>
<noscript>Grimoria needs JavaScript.</noscript>
<script src="%BASE_URL%assets/data/ru_RU.js"></script>
<script type="module" src="src/entry/main.ts"></script>
</body>
</html>
