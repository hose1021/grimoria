<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Routes are real paths and history.pushState changes the document URL, so
  // pin relative asset URLs to the app folder before any resource loads.
  (function () {
    var routes = ["bag", "seat", "secrets", "table", "player", "public", "help", "demo", "sheet"];
    var parts = location.pathname.split("/").filter(Boolean);
    var cut = parts.findIndex(function (part) { return routes.indexOf(part) !== -1; });
    if (cut < 0) cut = parts.length;
    var root = "/" + parts.slice(0, cut).join("/");
    if (root !== "/") root += "/";
    document.write('<base href="' + root + '">');
  })();
</script>
<meta name="theme-color" content="#0c0f11">
<title>Pocket Grimoire</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/bag.css">
<link rel="stylesheet" href="css/seat.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/setup.css">
<link rel="stylesheet" href="css/host.css">
<link rel="stylesheet" href="css/sheet.css">
</head>
<body>
<output id="storage-status" class="storage-status" role="alert" hidden></output>
<aside id="update-banner" class="update-banner" role="status" aria-live="polite" hidden>
  <p id="update-message"></p>
  <div class="update-actions">
    <button type="button" class="btn btn--accent" id="update-now"></button>
    <button type="button" class="btn" id="update-later"></button>
  </div>
</aside>
<main id="screen"></main>
<output id="offline-status" class="offline-status" aria-live="polite"></output>
<noscript>Pocket Grimoire needs JavaScript.</noscript>
<script src="assets/data/ru_RU.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
