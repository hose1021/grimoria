name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # History-dependent checks read the branch that will merge. A
          # synthetic merge of dev and main has two first adds per archive.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install pinned Rust for Cargo metadata
        run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci
      - run: git fetch origin ${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: npm run typecheck
      - run: node --test scripts/check-types-policy.test.ts scripts/serve-dist.test.ts scripts/role-ownership.test.ts scripts/documentation-inventory.test.ts scripts/openspec-reconcile.test.ts scripts/documentation-consumers.test.ts scripts/rule-registry.test.ts scripts/engine-boundary.test.ts scripts/engine-benchmark.test.ts scripts/wire-contract.test.ts scripts/guidance-map.test.ts scripts/check-risk-tier.test.ts scripts/conformance-fixture.test.ts scripts/archive-index.test.ts scripts/check-risk-artifacts.test.ts scripts/check-acceptance.test.ts scripts/rules-for.test.ts scripts/release-metadata.test.ts scripts/release-provenance.test.ts scripts/check-cargo-graph.test.ts
      - run: npm run graph:cargo
      - run: npm run docs:inventory -- HEAD
      - run: npm run openspec:reconcile > /dev/null
      - run: npm run rules:check
      - run: npm run rules:check -- --against origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: npm run rules:matrix
      - run: npm run archive:index -- --check
      - run: npm run archive:index -- --check --against origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: node scripts/check-types-policy.ts

  rust-native:
    name: Rust native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node scripts/check-cargo-graph.ts

  rust-wasm32:
    name: Rust wasm32
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust and target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
      - run: cargo build --workspace --exclude grimoria-cli --target wasm32-unknown-unknown
      - name: Compile wasm32 test harness
        run: cargo test --workspace --exclude grimoria-cli --target wasm32-unknown-unknown --no-run
      - name: Install the matching wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Execute the wire parity test in Node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p grimoria-wasm --target wasm32-unknown-unknown

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: node --test scripts/check-toolchain.test.ts
      - run: node scripts/check-toolchain.ts
      - run: node --test scripts/check-version.test.ts
      - run: node scripts/check-version.ts
      - run: node --test scripts/check-official.test.ts
      - run: node --test scripts/fetch-official.test.ts
      - run: node --test scripts/build-official-roles.test.ts
      - run: node scripts/check-official.ts

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test "src/**/*.test.ts"
      - run: node scripts/check-acceptance.ts

  browser:
    name: Playwright regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: 1.65.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          # The apt mirror is a single point of failure: when it is unreachable the
          # whole browser job dies before a single check runs. The GitHub runner
          # image already ships Chrome and the shared libraries Chromium needs, and
          # the browser-only install passed every check, so never depend on apt here.
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install chromium
      - name: Run browser regression checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.mjs
        run: node scripts/browser-check.ts

  scenarios:
    name: Full-game scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: 1.65.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          # The apt mirror is a single point of failure: when it is unreachable the
          # whole job dies before a single scenario runs. The GitHub runner image
          # already ships Chrome and the shared libraries Chromium needs, and the
          # browser-only install passed every check, so never depend on apt here.
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install chromium
      - name: Build the scenario artifact
        env:
          BASE_PATH: /pocket/
        run: |
          node node_modules/vite/bin/vite.js build --mode test
          node scripts/build-fallback.ts --root dist
          node scripts/build-offline.ts --root dist --out dist/sw.js
      - name: Run full-game scenarios
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.mjs
        run: node scripts/run-scenarios.ts
