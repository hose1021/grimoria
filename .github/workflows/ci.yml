name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/check-types-policy.test.ts scripts/serve-dist.test.ts
      - run: node scripts/check-types-policy.ts

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: node --test scripts/check-toolchain.test.ts
      - run: node scripts/check-toolchain.ts
      - run: node --test scripts/check-version.test.ts
      - run: node scripts/check-version.ts
      - run: node --test scripts/check-official.test.ts
      - run: node --test scripts/fetch-official.test.ts
      - run: node --test scripts/build-official-roles.test.ts
      - run: node scripts/check-official.ts

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test "src/**/*.test.ts"
      - run: node scripts/check-acceptance.ts

  browser:
    name: Playwright regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: 1.65.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          # The apt mirror is a single point of failure: when it is unreachable the
          # whole browser job dies before a single check runs. The GitHub runner
          # image already ships Chrome and the shared libraries Chromium needs, and
          # the browser-only install passed every check, so never depend on apt here.
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install chromium
      - name: Run browser regression checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.mjs
        run: node scripts/browser-check.ts

  scenarios:
    name: Full-game scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: 1.65.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          # The apt mirror is a single point of failure: when it is unreachable the
          # whole job dies before a single scenario runs. The GitHub runner image
          # already ships Chrome and the shared libraries Chromium needs, and the
          # browser-only install passed every check, so never depend on apt here.
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install chromium
      - name: Build the scenario artifact
        env:
          BASE_PATH: /pocket/
        run: |
          node node_modules/vite/bin/vite.js build --mode test
          node scripts/build-fallback.ts --root dist
          node scripts/build-offline.ts --root dist --out dist/sw.js
      - name: Run full-game scenarios
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.mjs
        run: node scripts/run-scenarios.ts
