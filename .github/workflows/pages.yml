name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue a newer push behind an active publication instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test js/*.test.mjs
      - run: node scripts/build-offline.mjs
      - run: |
          mkdir -p public
          cp -R index.html 404.html css js assets favicon.svg manifest.webmanifest sw.js .nojekyll public/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          # v4+ skips dotfiles by default; keep .nojekyll in the artifact as before.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
