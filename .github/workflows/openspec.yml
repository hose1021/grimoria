name: OpenSpec

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: openspec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.16.1
      - name: Check artifacts, sources and test references
        run: node scripts/openspec-check.mjs
      - name: Validate main specs
        run: openspec validate --specs --strict
      - name: Validate changes
        run: openspec validate --changes --strict
      - name: Check pull request references
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed-files.txt"
          node scripts/openspec-check.mjs --pr-body "$RUNNER_TEMP/pr-body.md" --changed-files "$RUNNER_TEMP/changed-files.txt"
